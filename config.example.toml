# yt-lite configuration. Restart the app after editing.
#
# The app reads this from your per-user config folder, creating it on first run:
#   Windows: %APPDATA%\yt-lite\config\config.toml
#   macOS:   ~/Library/Application Support/yt-lite/config.toml
# (Cmd/Ctrl+, opens that folder.) The template is config.example.toml in the yt-lite repo.

[google]
# OAuth client (type "Desktop app") from https://console.cloud.google.com/apis/credentials
client_id = ""
client_secret = ""

[player]
mpv_path = "mpv"          # full path, or a name found on PATH
ytdlp_path = "yt-dlp"     # full path, or a name found on PATH
max_height = 1080
sponsorblock = false
# sponsorblock_script = 'C:\path\to\sponsorblock.lua'
extra_args = []
resolver = "native"       # "native" (falls back to yt-dlp if it fails) or "yt-dlp"
codecs = ["avc1", "vp9", "av01"]   # native resolver preference at equal quality

[feed]
refresh_interval_minutes = 15   # minimum 15
max_age_days = 60
max_items = 1000
rss_concurrency = 8
hide_watched = false
# Channels to follow via RSS without signing in, e.g. ["UCBJycsmduvYEL83R_U4JriQ"]
extra_channels = []

[cache]
thumb_memory_mb = 50
thumb_disk_mb = 300

[ui]
show_memory = true
dark = true
