[package]
name = "yt-lite-core"
description = "UI-independent core of yt-lite: feeds, YouTube API/RSS, Shorts filter, cache, auth"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = ["loopback-auth"]
# Desktop OAuth sign-in: opens the system browser and listens on 127.0.0.1.
# Mobile front-ends do the browser step themselves (ASWebAuthenticationSession).
loopback-auth = ["dep:open"]

[dependencies]
anyhow.workspace = true
log.workspace = true
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true

# Blocking HTTP; callers choose how to run it off their UI thread.
ureq = { version = "3.4", features = ["json"] }
url = "2.5"

rusqlite = { version = "0.40", features = ["bundled"] }
keyring = "4.2"
directories = "6"

toml = "1.1"
# Edits config.toml in place, keeping comments and layout.
toml_edit = "0.25"
roxmltree = "0.21"

sha2 = "0.11"
base64 = "0.23"
getrandom = "0.4"
open = { version = "5.4", optional = true }

# keyring's Apple store must use the data-protection keychain on iOS.
[target.'cfg(target_os = "ios")'.dependencies]
apple-native-keyring-store = { version = "1", features = ["protected"] }
