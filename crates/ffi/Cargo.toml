[package]
name = "yt-lite-ffi"
description = "Swift and Kotlin (UniFFI) bindings over yt-lite-core for the iOS and Android apps"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "yt_lite_ffi"
# staticlib for the iOS xcframework; cdylib for Android (and so uniffi-bindgen
# can read metadata on the host).
crate-type = ["staticlib", "cdylib", "lib"]

[[bin]]
name = "uniffi-bindgen"
path = "uniffi-bindgen.rs"

[dependencies]
yt-lite-core = { workspace = true, default-features = false }
anyhow.workspace = true
log.workspace = true
uniffi = { version = "0.32", features = ["cli"] }
# The Android app's secret store plugs into keyring-core (see secret_store.rs).
keyring-core = "1"
