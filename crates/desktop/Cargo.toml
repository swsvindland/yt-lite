[package]
name = "yt-lite"
description = "Lightweight native YouTube client (GPUI + mpv)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "yt-lite"
path = "src/main.rs"

[dependencies]
yt-lite-core.workspace = true
anyhow.workspace = true
log.workspace = true
serde_json.workspace = true
chrono.workspace = true

# UI: gpui-kit pins a matching GPUI snapshot (gpui-pre) and re-exports gpui + gpui-component.
# Default features = component + lucide icon assets. No web view / JS runtime.
gpui-kit = "0.7.1"
# Runs blocking core calls off the UI thread (smol::unblock), awaited from GPUI tasks.
smol = "2"
futures = "0.3"
open = "5.4"

# Thumbnails: decode JPEG only, at display size. Version must match gpui-pre's `image`.
image = { version = "0.25", default-features = false, features = ["jpeg"] }

env_logger = "0.11"
memory-stats = "1.2"

# Windows: the app icon resource (build.rs).
[build-dependencies]
embed-resource = "3"

# macOS playback: AVPlayer in an AVKit player window (same objc2 family GPUI uses).
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-app-kit = "0.3"
objc2-av-foundation = { version = "0.3", features = ["objc2-core-media"] }
objc2-av-kit = "0.3"
objc2-core-foundation = "0.3"
objc2-core-media = "0.3"

# Windows playback: WinRT MediaPlayer via Windows.UI.Composition.
[target.'cfg(windows)'.dependencies]
yt-lite-winplayer.workspace = true
